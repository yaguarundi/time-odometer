<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Odometer</title>
    <script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4/build/global/luxon.min.js"></script>
    <link rel="icon" type="image/png" href="timeodometer.png">
    <link rel="apple-touch-icon" href="timeodometer.png">
    <link rel="stylesheet" href="TimeOdometer.css">
</head>
<body>
<div class="container">
    <h2>Time Odometer</h2>
    <div class="sync-status" id="syncStatus">Syncing...</div>
    <div class="input-group">
        <label for="birthdatetime">Enter Date and Time:</label>
        <div class="main-date-group">
            <div class="input-dow-wrapper">
                <input type="datetime-local" id="birthdatetime" value="2000-01-01T00:00:00" step="1" min="1000-01-01T00:00:00" max="9999-12-31T23:59:59">
            </div>
            <span class="main-dow" id="main-dow"></span>
            <button type="button" id="btn-now" class="btn-now">Now</button>
        </div>
        <div class="error-message" id="errorMsg">Please enter a valid date (Year 1000-9999).</div>
    </div>
    <div class="input-group">
        <label for="tzLocation">Location:</label>
        <select id="tzLocation">
            <option value="UTC">UTC</option>
        </select>
    </div>
    <div class="input-group">
        <label for="targetTzLocation">Target Location:</label>
        <select id="targetTzLocation">
            <option value="UTC">UTC</option>
        </select>
    </div>
    <div class="results" id="resultsPanel">
        <div class="row" data-unit="seconds">
            <div class="row-main">
                <span class="row-label">Seconds</span>
                <span class="leap-notice" id="r-leap"></span>
                <span id="r-sec" class="bold-number">0</span>
            </div>
            <div class="milestone-container">
                <div class="ms-date-group">
                    <input type="datetime-local" class="ms-date-input" step="1" title="Target Date">
                    <span class="ms-dow"></span>
                </div>
                <input type="text" class="ms-input" placeholder="e.g. 1,000,000 or -50,000">
            </div>
        </div>
        <div class="row" data-unit="minutes">
            <div class="row-main"><span class="row-label">Minutes</span> <span id="r-min" class="bold-number">0</span></div>
            <div class="milestone-container">
                <div class="ms-date-group">
                    <input type="datetime-local" class="ms-date-input" step="1" title="Target Date">
                    <span class="ms-dow"></span>
                </div>
                <input type="text" class="ms-input" placeholder="e.g. 500,000 or -1,000">
            </div>
        </div>
        <div class="row" data-unit="hours">
            <div class="row-main"><span class="row-label">Hours</span> <span id="r-hour" class="bold-number">0</span></div>
            <div class="milestone-container">
                <div class="ms-date-group">
                    <input type="datetime-local" class="ms-date-input" step="1" title="Target Date">
                    <span class="ms-dow"></span>
                </div>
                <input type="text" class="ms-input" placeholder="e.g. 10,000 or -500">
            </div>
        </div>
        <div class="row" data-unit="days">
            <div class="row-main"><span class="row-label">Days</span> <span id="r-day" class="bold-number">0</span></div>
            <div class="milestone-container">
                <div class="ms-date-group">
                    <input type="datetime-local" class="ms-date-input" step="1" title="Target Date">
                    <span class="ms-dow"></span>
                </div>
                <input type="text" class="ms-input" placeholder="e.g. 5,000 or -100">
            </div>
        </div>
        <div class="row" data-unit="weeks">
            <div class="row-main"><span class="row-label">Weeks</span> <span id="r-week" class="bold-number">0</span></div>
            <div class="milestone-container">
                <div class="ms-date-group">
                    <input type="datetime-local" class="ms-date-input" step="1" title="Target Date">
                    <span class="ms-dow"></span>
                </div>
                <input type="text" class="ms-input" placeholder="e.g. 2,000 or -50">
            </div>
        </div>
        <div class="row" data-unit="months">
            <div class="row-main"><span class="row-label">Months</span> <span id="r-month" class="bold-number">0</span></div>
            <div class="milestone-container">
                <div class="ms-date-group">
                    <input type="datetime-local" class="ms-date-input" step="1" title="Target Date">
                    <span class="ms-dow"></span>
                </div>
                <input type="text" class="ms-input" placeholder="e.g. 500 or -12">
            </div>
        </div>
        <div class="row" data-unit="years">
            <div class="row-main"><span class="row-label">Years</span> <span id="r-year" class="bold-number">0</span></div>
            <div class="milestone-container">
                <div class="ms-date-group">
                    <input type="datetime-local" class="ms-date-input" step="1" title="Target Date">
                    <span class="ms-dow"></span>
                </div>
                <input type="text" class="ms-input" placeholder="e.g. 50 or -5">
            </div>
        </div>
        <div class="settings-panel">
        <label class="toggle-wrapper">
            <input type="checkbox" id="toggleCommas" checked> Delimiter
        </label>
        <label class="toggle-wrapper">
            <input type="checkbox" id="toggle24hr"> 24-Hour
        </label>
    </div>
        <div class="detailed-row" id="r-detailed">Loading...</div>
        <div class="current-time" id="r-current-time">--</div>
    </div>
    <div class="footer">
        <a href="https://linktr.ee/yaguarundi" target="_blank" rel="noopener noreferrer" title="Links">
            <span class="linktree-icon"></span>
        </a>
        <p class="copyright">&copy; <span id="current-year"></span> Yago Yaguarundi. All rights reserved.</p>
    </div>
</div>
<script>
    // --- NATIVE FONT CLONING SCRIPT ---
    // This accurately reads the browser's hidden native input font and clones it to the Day of the Week text.
    window.addEventListener('DOMContentLoaded', () => {
        const nativeInputFont = window.getComputedStyle(document.getElementById('birthdatetime')).fontFamily;
        document.querySelectorAll('.main-dow, .ms-dow').forEach(span => {
            span.style.fontFamily = nativeInputFont;
        });
    });

    const DateTime = luxon.DateTime;
    let intervalId;
    let clockOffsetMs = 0; 
    let isSynced = false;

    const tzSelect = document.getElementById('tzLocation');
    const targetTzSelect = document.getElementById('targetTzLocation');
    const timeZones = Intl.supportedValuesOf('timeZone');
    const userTz = Intl.DateTimeFormat().resolvedOptions().timeZone;

    timeZones.forEach(tz => {
        const option1 = document.createElement('option');
        option1.value = tz; option1.textContent = tz.replace(/_/g, ' ');
        
        const option2 = option1.cloneNode(true);
        if (tz === userTz) { 
            option1.selected = true; 
            option2.selected = true; 
        }
        tzSelect.appendChild(option1);
        targetTzSelect.appendChild(option2);
    });

    async function syncWithServer() {
        const statusEl = document.getElementById('syncStatus');
        const savedOffset = localStorage.getItem('atomicOffsetMs');
        if (savedOffset) {
            clockOffsetMs = parseFloat(savedOffset);
            statusEl.innerText = "Syncing...";
            statusEl.style.color = "#b3b3b3"
        } else {
            statusEl.innerText = "Syncing...";
            statusEl.style.color = "#b3b3b3"
        }
        calculate();
        if (intervalId) clearInterval(intervalId);
        intervalId = setInterval(calculate, 1000);
        let bestLatency = Infinity;
        let successfulPings = 0;
        const pingServer = async () => {
            const requestSentAt = performance.now(); 
            const response = await fetch('https://timeapi.io/api/Time/current/zone?timeZone=UTC', { cache: "no-store" });
            if (!response.ok) throw new Error("Server rejected request");
            const data = await response.json();
            const latencyMs = performance.now() - requestSentAt;
            if (latencyMs < bestLatency) {
                bestLatency = latencyMs;
                const estimatedOneWayTripMs = latencyMs / 2;
                const serverTime = DateTime.fromISO(data.dateTime, { zone: 'utc' }).plus({ milliseconds: estimatedOneWayTripMs });
                const localComputerTime = DateTime.utc(); 
                clockOffsetMs = serverTime.diff(localComputerTime).toMillis();
                localStorage.setItem('atomicOffsetMs', clockOffsetMs);
                const offsetSeconds = (clockOffsetMs / 1000).toFixed(3);
                statusEl.innerText = `Precision sync completed. Adjusted by ${offsetSeconds} s (Latency: ${bestLatency.toFixed(0)} ms).`;
                statusEl.style.color = "#38d22d";   
                calculate(); 
            }
            successfulPings++;
        };
        try {
            await Promise.all([pingServer(), pingServer(), pingServer()]);
        } catch (error) {
            if (successfulPings === 0 && !savedOffset) {
                statusEl.innerText = "Precision sync failed. Relying on local device clock.";
                statusEl.style.color = "#ff4d4d";
            }
        }
    }

    const leapSecondDates = [
        "1972-06-30T23:59:59Z", "1972-12-31T23:59:59Z", "1973-12-31T23:59:59Z", "1974-12-31T23:59:59Z",
        "1975-12-31T23:59:59Z", "1976-12-31T23:59:59Z", "1977-12-31T23:59:59Z", "1978-12-31T23:59:59Z",
        "1979-12-31T23:59:59Z", "1981-06-30T23:59:59Z", "1982-06-30T23:59:59Z", "1983-06-30T23:59:59Z",
        "1985-06-30T23:59:59Z", "1987-12-31T23:59:59Z", "1989-12-31T23:59:59Z", "1990-12-31T23:59:59Z",
        "1992-06-30T23:59:59Z", "1993-06-30T23:59:59Z", "1994-06-30T23:59:59Z", "1995-12-31T23:59:59Z",
        "1997-06-30T23:59:59Z", "1998-12-31T23:59:59Z", "2005-12-31T23:59:59Z", "2008-12-31T23:59:59Z",
        "2012-06-30T23:59:59Z", "2015-06-30T23:59:59Z", "2016-12-31T23:59:59Z"
    ].map(iso => DateTime.fromISO(iso));

    function countLeapSeconds(startDateTime, endDateTime) {
        return leapSecondDates.filter(ls => ls >= startDateTime && ls <= endDateTime).length;
    }

    function evaluateDateFromAmount(unit, amountInput, dateInput, dowSpan) {
        const rawVal = amountInput.value.replace(/,/g, '');
        const tVal = parseFloat(rawVal);
        
        if (!rawVal || isNaN(tVal) || rawVal === '' || rawVal === '-') { 
            dateInput.value = ''; 
            dowSpan.innerText = '';
            return; 
        }

        const inputVal = document.getElementById('birthdatetime').value;
        const originTz = document.getElementById('tzLocation').value;
        const targetTz = document.getElementById('targetTzLocation').value; 
        
        const birthDate = DateTime.fromISO(inputVal, { zone: originTz }).startOf('second');

        if (!birthDate.isValid) return;

        let targetDate;
        const isPast = tVal < 0;

        if (unit === 'seconds') {
            let birthMs = birthDate.toMillis();
            let targetMsGuess = birthMs + (tVal * 1000);
            
            for(let i=0; i<3; i++) {
                let d1 = DateTime.fromMillis(Math.min(birthMs, targetMsGuess));
                let d2 = DateTime.fromMillis(Math.max(birthMs, targetMsGuess));
                let ls = countLeapSeconds(d1, d2);
                
                if (isPast) {
                    targetMsGuess = birthMs + (tVal * 1000) + (ls * 1000);
                } else {
                    targetMsGuess = birthMs + (tVal * 1000) - (ls * 1000);
                }
            }
            targetDate = DateTime.fromMillis(targetMsGuess).setZone(targetTz);
        } else {
            let durationObj = {};
            durationObj[unit] = tVal; 
            targetDate = birthDate.plus(durationObj).setZone(targetTz);
        }

        dateInput.value = targetDate.toFormat("yyyy-MM-dd'T'HH:mm:ss");
        dowSpan.innerText = targetDate.toFormat("EEEE");
    }

    function evaluateAmountFromDate(unit, dateInput, amountInput, dowSpan) {
        const dateVal = dateInput.value;
        
        if (!dateVal) {
            amountInput.value = '';
            dowSpan.innerText = '';
            return;
        }

        const inputVal = document.getElementById('birthdatetime').value;
        const originTz = document.getElementById('tzLocation').value;
        const targetTz = document.getElementById('targetTzLocation').value;
        
        const birthDate = DateTime.fromISO(inputVal, { zone: originTz }).startOf('second');
        const targetDate = DateTime.fromISO(dateVal, { zone: targetTz }).startOf('second');

        if (!birthDate.isValid || !targetDate.isValid) return;

        let tVal = 0;
        if (unit === 'seconds') {
            let diffMs = targetDate.toMillis() - birthDate.toMillis();
            let unixSeconds = Math.floor(diffMs / 1000); 
            
            let d1 = DateTime.fromMillis(Math.min(birthDate.toMillis(), targetDate.toMillis()));
            let d2 = DateTime.fromMillis(Math.max(birthDate.toMillis(), targetDate.toMillis()));
            let ls = countLeapSeconds(d1, d2);

            if (targetDate < birthDate) {
                tVal = unixSeconds - ls; 
            } else {
                tVal = unixSeconds + ls;
            }
        } else {
            let diff = targetDate.diff(birthDate, unit);
            tVal = parseFloat(diff[unit].toFixed(4)); 
        }

        tVal = tVal + 0;

        let isNegative = tVal < 0;
        let absVal = Math.abs(tVal);
        let parts = absVal.toString().split('.');
        let intPart = parseInt(parts[0], 10).toLocaleString('en-US');
        let finalStr = parts.length > 1 ? intPart + '.' + parts[1] : intPart;
        
        amountInput.value = isNegative ? '-' + finalStr : finalStr;
        dowSpan.innerText = targetDate.toFormat("EEEE");
    }

    function updateAllMilestones() {
        document.querySelectorAll('.row').forEach(row => {
            const unit = row.getAttribute('data-unit');
            const amountInput = row.querySelector('.ms-input');
            const dateInput = row.querySelector('.ms-date-input');
            const dowSpan = row.querySelector('.ms-dow');
            
            if (amountInput.value && amountInput.value !== '-') {
                evaluateDateFromAmount(unit, amountInput, dateInput, dowSpan);
            } else if (dateInput.value) {
                evaluateAmountFromDate(unit, dateInput, amountInput, dowSpan);
            }
        });
    }

    document.querySelectorAll('.row').forEach(row => {
        const unit = row.getAttribute('data-unit');
        const amountInput = row.querySelector('.ms-input');
        const dateInput = row.querySelector('.ms-date-input');
        const dowSpan = row.querySelector('.ms-dow');

        amountInput.addEventListener('input', function(e) {
            let val = this.value;
            let isNegative = val.trim().startsWith('-');
            
            // STRICT NO-DECIMAL FILTER FOR SECONDS
            let rawStr = (unit === 'seconds') ? val.replace(/\D/g, '') : val.replace(/[^\d.]/g, '');
            
            let parts = rawStr.split('.');
            if (parts.length > 2) {
                parts = [parts[0], parts.slice(1).join('')];
            }
            
            if (parts[0] !== '') {
                let intPart = parseInt(parts[0], 10).toLocaleString('en-US');
                let finalStr = parts.length > 1 ? intPart + '.' + parts[1] : intPart;
                this.value = isNegative ? '-' + finalStr : finalStr;
            } else if (parts.length > 1) {
                let finalStr = '0.' + parts[1];
                this.value = isNegative ? '-' + finalStr : finalStr;
            } else {
                this.value = isNegative ? '-' : '';
            }
            
            evaluateDateFromAmount(unit, amountInput, dateInput, dowSpan);
        });

        dateInput.addEventListener('input', function() {
            evaluateAmountFromDate(unit, dateInput, amountInput, dowSpan);
        });
    });

    function calculate() {
        const inputVal = document.getElementById('birthdatetime').value;
        const tzLocation = document.getElementById('tzLocation').value;
        const resultsPanel = document.getElementById('resultsPanel');
        const errorMsg = document.getElementById('errorMsg');
        const mainDowSpan = document.getElementById('main-dow');
        
        const useCommas = document.getElementById('toggleCommas').checked;
        const use24hr = document.getElementById('toggle24hr').checked;
        
        if (!inputVal) {
            resultsPanel.style.display = 'none'; 
            errorMsg.style.display = 'none'; 
            mainDowSpan.innerText = '';
            return;
        }

        const rawBirthDate = DateTime.fromISO(inputVal, { zone: tzLocation });
        const birthDate = rawBirthDate.startOf('second');
        
        if (birthDate.isValid) {
            mainDowSpan.innerText = birthDate.toFormat("EEEE");
        } else {
            mainDowSpan.innerText = '';
        }

        const localNow = DateTime.local().plus({ milliseconds: clockOffsetMs }); 
        
        const calcNow = localNow.setZone(tzLocation).startOf('second');
        
        if (!birthDate.isValid || birthDate.year < 1000 || birthDate.year > 9999) {
            resultsPanel.style.display = 'none'; errorMsg.style.display = 'block'; return;
        }

        errorMsg.style.display = 'none'; resultsPanel.style.display = 'flex';

        const diffMs = calcNow.diff(birthDate).toMillis();
        const unixSeconds = Math.floor(diffMs / 1000); 
        
        let d1 = DateTime.fromMillis(Math.min(birthDate.toMillis(), calcNow.toMillis()));
        let d2 = DateTime.fromMillis(Math.max(birthDate.toMillis(), calcNow.toMillis()));
        const leapSecs = countLeapSeconds(d1, d2);
        
        const physicalSeconds = diffMs < 0 ? unixSeconds - leapSecs : unixSeconds + leapSecs;

        const formatNum = (num) => {
            let safeNum = Math.floor(num) + 0; 
            
            if (useCommas) {
                return safeNum.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
            } else {
                return safeNum.toString(); 
            }
        };

        document.getElementById('r-sec').innerText = formatNum(physicalSeconds);
        
        if (leapSecs > 0) {
            document.getElementById('r-leap').innerText = `${diffMs < 0 ? '-' : '+'}${leapSecs} leap sec`;
        } else {
            document.getElementById('r-leap').innerText = '';
        }
        
        document.getElementById('r-min').innerText = formatNum(calcNow.diff(birthDate, 'minutes').minutes);
        document.getElementById('r-hour').innerText = formatNum(calcNow.diff(birthDate, 'hours').hours);
        document.getElementById('r-day').innerText = formatNum(calcNow.diff(birthDate, 'days').days);
        document.getElementById('r-week').innerText = formatNum(calcNow.diff(birthDate, 'weeks').weeks);
        document.getElementById('r-month').innerText = formatNum(calcNow.diff(birthDate, 'months').months);
        document.getElementById('r-year').innerText = formatNum(calcNow.diff(birthDate, 'years').years); 

        const clean = (n) => Math.floor(n) + 0;
        const detailedDiff = calcNow.diff(birthDate, ['years', 'months', 'days', 'hours', 'minutes', 'seconds']);
        
        const detailedAge = `${clean(detailedDiff.years)} years, ${clean(detailedDiff.months)} months, ${clean(detailedDiff.weeks)} weeks, ${clean(detailedDiff.days)} days, ` +
                            `${clean(detailedDiff.hours)} hours, ${clean(detailedDiff.minutes)} minutes, ${clean(detailedDiff.seconds)} seconds`;
        
        document.getElementById('r-detailed').innerText = detailedAge;

        const timeFormatString = use24hr ? "EEEE, MMMM d, yyyy, HH:mm:ss" : "EEEE, MMMM d, yyyy, hh:mm:ss a";
        const currentTimeString = localNow.toFormat(timeFormatString);
        document.getElementById('r-current-time').innerText = `${currentTimeString}`;
    }

    // "Now" button logic
    document.getElementById('btn-now').addEventListener('click', () => {
        const tzLocation = document.getElementById('tzLocation').value;
        const localNow = DateTime.local().plus({ milliseconds: clockOffsetMs }); 
        const calcNow = localNow.setZone(tzLocation).startOf('second');
        
        document.getElementById('birthdatetime').value = calcNow.toFormat("yyyy-MM-dd'T'HH:mm:ss");
        calculate();
        updateAllMilestones();
    });

    document.getElementById('birthdatetime').addEventListener('input', () => { calculate(); updateAllMilestones(); });
    document.getElementById('tzLocation').addEventListener('change', () => { calculate(); updateAllMilestones(); });
    document.getElementById('targetTzLocation').addEventListener('change', () => { calculate(); updateAllMilestones(); });
    document.getElementById('toggleCommas').addEventListener('change', calculate);
    document.getElementById('toggle24hr').addEventListener('change', calculate);

    syncWithServer();

    var yearText = document.getElementById("current-year");
    if (yearText) {
        yearText.innerText = new Date().getFullYear();
    }
</script>
</body>
</html>
