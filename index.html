<!DOCTYPE html>
<html lang="en-US">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-4Z2LPX6TMP"></script>

    <script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4/build/global/luxon.min.js"></script>

</head>
<body>
<div class="container">
    <div class="half-container">
    <h2>Time&nbsp;Odometer</h2>
    <p class="privacy-notice">🔒&nbsp;Private &amp; Secure</p>

    <div class="input-group">
        <label for="vbirthdatetime">Enter Date and Time:<span class="tooltip-container">
                    <svg class="tooltip-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                        <line x1="12" y1="17" x2="12.01" y2="17"></line>
                    </svg>
                    <span class="tooltip-text">From years &quot;0&quot;&nbsp;&lpar;1&nbsp;BC&rpar;&nbsp;to 9999 AD.</span>
                </span></label>
        <div class="main-date-group">
            <div class="input-dow-wrapper">
                <input type="datetime-local" class="ms-date-input" id="birthdatetime" step="1" min="0000-01-01T00:00:00" max="9999-12-31T23:59:59">
                <span class="main-dow" id="main-dow" style="color: #634E34;">EEE</span>
            </div>
            <div class="button-group">
                <button type="button" id="btn-now" class="btn-now">Now</button>
                <button type="button" id="btn-clear" class="btn-clear">Clear</button>
            </div>
        </div>
    </div>
    <div class="dropdown-row">
        <div class="input-group">
            <label for="tzLocation">Origin Location:<span class="tooltip-container">
                    <svg class="tooltip-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                        <line x1="12" y1="17" x2="12.01" y2="17"></line>
                    </svg>
                    <span class="tooltip-text">Event location (e.g. your place of birth).</span>
                </span>
            </label>
            <select id="tzLocation"></select>
        </div>
        <div class="input-group">
            <label for="targetTzLocation">Target Location:<span class="tooltip-container">
                    <svg class="tooltip-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                        <line x1="12" y1="17" x2="12.01" y2="17"></line>
                    </svg>
                    <span class="tooltip-text">For milestones (e.g. your current place).</span>
                </span>
            </label>
            <select id="targetTzLocation"></select>
        </div>
    </div>
            <div class="settings-panel">
            <label class="toggle-wrapper"><input type="checkbox" id="toggleCommas" checked>Separator</label>
            <label class="toggle-wrapper">24-hour<input type="checkbox" id="toggle24hr"></label>
        </div>
        <div class="donation-section">
    <p class="donation-text">Like it? Support the project!</p>
    <a href="https://ko-fi.com/yaguarundi" target="_blank" rel="noopener noreferrer" title="Support me on Ko-fi.">
        <img src="kofilogo.png" alt="Ko-fi" class="kofi-icon">
    </a>
    </div>
    </div>
    <div class="results half-container" id="resultsPanel">
        <div class="row" data-unit="seconds">
            <div class="row-main">
                <span class="row-label">Seconds</span>
                <span id="r-sec" class="bold-number">0</span>
            </div>
            <div class="milestone-container">
                <div class="ms-date-group">
                    <input type="datetime-local" class="ms-date-input" step="1" title="Target Date">
                    <span class="ms-dow" style="color: #634E34;">EEE</span>
                </div>
                <input type="text" class="ms-input" placeholder="&plusmn;0">
            </div>
        </div>
        <div class="row" data-unit="minutes">
            <div class="row-main"><span class="row-label">Minutes</span> <span id="r-min" class="bold-number">0</span></div>
            <div class="milestone-container"><div class="ms-date-group"><input type="datetime-local" class="ms-date-input" step="1"><span class="ms-dow" style="color: #634E34;">EEE</span></div><input type="text" class="ms-input" placeholder="&plusmn;0.0000"></div>
        </div>
        <div class="row" data-unit="hours">
            <div class="row-main"><span class="row-label">Hours</span> <span id="r-hour" class="bold-number">0</span></div>
            <div class="milestone-container"><div class="ms-date-group"><input type="datetime-local" class="ms-date-input" step="1"><span class="ms-dow" style="color: #634E34;">EEE</span></div><input type="text" class="ms-input" placeholder="&plusmn;0.0000"></div>
        </div>
        <div class="row" data-unit="days">
            <div class="row-main"><span class="row-label">Days</span> <span id="r-day" class="bold-number">0</span></div>
            <div class="milestone-container"><div class="ms-date-group"><input type="datetime-local" class="ms-date-input" step="1"><span class="ms-dow" style="color: #634E34;">EEE</span></div><input type="text" class="ms-input" placeholder="&plusmn;0.0000"></div>
        </div>
        <div class="row" data-unit="weeks">
            <div class="row-main"><span class="row-label">Weeks</span> <span id="r-week" class="bold-number">0</span></div>
            <div class="milestone-container"><div class="ms-date-group"><input type="datetime-local" class="ms-date-input" step="1"><span class="ms-dow" style="color: #634E34;">EEE</span></div><input type="text" class="ms-input" placeholder="&plusmn;0.0000"></div>
        </div>
        <div class="row" data-unit="months">
            <div class="row-main"><span class="row-label">Months</span> <span id="r-month" class="bold-number">0</span></div>
            <div class="milestone-container"><div class="ms-date-group"><input type="datetime-local" class="ms-date-input" step="1"><span class="ms-dow" style="color: #634E34;">EEE</span></div><input type="text" class="ms-input" placeholder="&plusmn;0.0000"></div>
        </div>
        <div class="row" data-unit="years">
            <div class="row-main"><span class="row-label">Years</span> <span id="r-year" class="bold-number">0</span></div>
            <div class="milestone-container"><div class="ms-date-group"><input type="datetime-local" class="ms-date-input" step="1"><span class="ms-dow" style="color: #634E34;">EEE</span></div><input type="text" class="ms-input" placeholder="&plusmn;0.0000"></div>
        </div>
    </div> <div class="results half-container" id="extraPanel">
        <div class="detailed-row" id="r-detailed">Loading...</div>
        <div class="current-time" id="r-current-time">--</div>
        <div class="time-offset" id="r-time-offset"></div>
        <div class="footer">
        <a href="https://linktr.ee/yaguarundi" target="_blank" rel="noopener noreferrer" title="Links">
            <span class="linktree-icon"></span>
        </a>
        <p class="copyright">&copy; <span id="current-year">2026</span>&nbsp;Yago&nbsp;Yaguarundi.&nbsp;All rights reserved.</p>
    </div>
    </div>
    </div>
</div>
<script>
    const DateTime = luxon.DateTime;
    luxon.Settings.defaultLocale = "en-US";
    let intervalId;
    let timeOffset = 0; 
    let syncRetries = 0;
    const MAX_SYNC_RETRIES = 1;
    const handleManualTyping = (e, instance) => {
        const val = e.target.value;
        const is24hr = document.getElementById('toggle24hr').checked;
        const template = is24hr ? "yyyy-mm-dd, HH:mm:ss" : "yyyy-mm-dd, hh:mm:ss _M";
        if (!val) {
            e.target.style.color = '#634E34';
            instance.clear();
            if (instance.element.id !== 'birthdatetime') {
                syncMilestones(null, instance.element);
            }
            return;
        }
        const dateStr = val.substring(0, 10);
        const dateIsFullyTyped = !/[ymd]/.test(dateStr);
        let dateIsImpossible = false;
        if (dateIsFullyTyped) {
            const parsedDateOnly = DateTime.fromFormat(dateStr, "yyyy-MM-dd");
            if (!parsedDateOnly.isValid) {
                dateIsImpossible = true;
            }
        }
        let timeIsImpossible = false;
        if (val.includes(":60")) {
            const tz = e.target.closest('.milestone-container') ? document.getElementById('targetTzLocation').value : document.getElementById('tzLocation').value;
            const isLeap = isLeapSecondMinute(val, tz, is24hr);
            if (!isLeap && (val.match(/(AM|PM)/i) || is24hr)) {
                timeIsImpossible = true;
            }
        }
        if (dateIsImpossible || timeIsImpossible) {
            e.target.style.color = '#ff4d4d'; 
        } else {
            const isComplete = !/[ymdhHs]/.test(val) && (!is24hr ? !val.endsWith('_M') : true);
            e.target.style.color = (val === template) ? '#634E34' : (isComplete ? '#E0CBB9' : '#E0CBB9');
        }
        const incomplete = is24hr ? /[ymdhHs]/.test(val) : /[ymdhHs]/.test(val) || val.endsWith('_M');
        if (incomplete || dateIsImpossible || timeIsImpossible) {
            if (instance.element.id !== 'birthdatetime') {
                syncMilestones(null, instance.element);
            }
            return; 
        }
        const tz = e.target.closest('.milestone-container') ? document.getElementById('targetTzLocation').value : document.getElementById('tzLocation').value;
        let checkVal = val;
        let has60 = val.includes(":60") && isLeapSecondMinute(val, tz, is24hr);
        if (has60) checkVal = val.replace(":60", ":59");
        const format = is24hr ? "yyyy-MM-dd, HH:mm:ss" : "yyyy-MM-dd, hh:mm:ss a";
        const parsed = DateTime.fromFormat(checkVal, format);
        if (parsed.isValid) {
            e.target.style.color = '#E0CBB9'; 
            const iso = parsed.toFormat("yyyy-MM-dd'T'HH:mm:ss");
            let start = e.target.selectionStart;
            let end = e.target.selectionEnd;
            instance.element.value = iso;
            if (has60) {
                e.target.dataset.hasLeap60 = "true";
                e.target.value = val;
                e.target.setSelectionRange(start, end);
            } else {
                e.target.dataset.hasLeap60 = "false";
            }
            instance.element.dispatchEvent(new Event('input', { bubbles: true }));
            if (has60) {
                e.target.value = val;
                e.target.setSelectionRange(start, end);
            }
        } else {
            e.target.dataset.hasLeap60 = "false";
            e.target.value = "";
            e.target.dispatchEvent(new Event('input', { bubbles: true }));
            instance.clear();
        }
    };
    const handleInputBlur = (e, instance) => {
        const val = e.target.value;
        const is24hr = document.getElementById('toggle24hr').checked;
        const template = is24hr ? "yyyy-mm-dd, HH:mm:ss" : "yyyy-mm-dd, hh:mm:ss _M";
        if (!val || val === template) return;
        const dateStr = val.substring(0, 10);
        const dateIsFullyTyped = !/[ymd]/.test(dateStr);
        let dateIsImpossible = false;
        if (dateIsFullyTyped) {
            const parsedDateOnly = DateTime.fromFormat(dateStr, "yyyy-MM-dd");
            if (!parsedDateOnly.isValid) {
                dateIsImpossible = true;
            }
        }
        let timeIsImpossible = false;
        if (val.includes(":60")) {
            const tz = e.target.closest('.milestone-container') ? document.getElementById('targetTzLocation').value : document.getElementById('tzLocation').value;
            const isLeap = isLeapSecondMinute(val, tz, is24hr);
            if (!isLeap && (val.match(/(AM|PM)/i) || is24hr)) {
                timeIsImpossible = true;
            }
        }
        const incomplete = is24hr ? /[ymdhHs]/.test(val) : /[ymdhHs]/.test(val) || val.endsWith('_M');
        if (dateIsImpossible || timeIsImpossible || incomplete) {
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation(); 
            e.target.value = "";
            e.target.style.color = '#634E34';
            e.target.dispatchEvent(new Event('input', { bubbles: true }));
            instance.clear();
        }
    };
    window.addEventListener('DOMContentLoaded', () => {
        const nativeInputFont = window.getComputedStyle(document.getElementById('birthdatetime')).fontFamily;
        const tooltips = document.querySelectorAll('.tooltip-container');
        let activeTooltip = null;
        let shieldTimer = null;
        tooltips.forEach(container => {
            ['pointerdown', 'touchstart', 'click'].forEach(evt => {
                container.addEventListener(evt, (e) => {
                    if (window.innerWidth > 1366) return;
                    e.preventDefault();
                    e.stopPropagation();
                    if (evt === 'pointerdown') {
                        if (activeTooltip) {
                            activeTooltip.classList.remove('is-open');
                            activeTooltip.closest('.input-group').style.zIndex = '2'; 
                        }
                        if (activeTooltip === container) {
                            activeTooltip = null;
                        } else {
                            container.classList.add('is-open');
                            container.closest('.input-group').style.zIndex = '999999'; 
                            activeTooltip = container;
                        }
                    }
                });
            });
        });
        ['pointerdown', 'touchstart', 'click'].forEach(evt => {
            document.addEventListener(evt, (e) => {
                if (window.innerWidth > 1366) return;
                if (shieldTimer) {
                    e.preventDefault();
                    e.stopPropagation();
                    return;
                }
                if (activeTooltip && !activeTooltip.contains(e.target)) {
                    e.preventDefault();
                    e.stopPropagation();
                    activeTooltip.classList.remove('is-open');
                    activeTooltip.closest('.input-group').style.zIndex = '2'; 
                    activeTooltip = null;
                    shieldTimer = setTimeout(() => { shieldTimer = null; }, 300);
                }
            }, { capture: true, passive: false });
        });
        document.querySelectorAll('.main-dow, .ms-dow').forEach(span => {
            span.style.fontFamily = nativeInputFont;
            span.style.fontWeight = "bold";
        });
        function forceLeadingZero(instance) {
            if (instance.hourElement) {
                if (instance.hourElement.type !== 'text') instance.hourElement.type = 'text'; 
                instance.hourElement.value = String(instance.hourElement.value).padStart(2, '0');
            }
        }
        const fpConfig = {
            enableTime: true,
            enableSeconds: true,
            dateFormat: "Y-m-d\\TH:i:S", 
            altInput: true,
            altFormat: "Y-m-d, h:i:S K", 
            altInputClass: "ms-date-input",
            minDate: "0000-01-01",
            disableMobile: "true",
            allowInput: true,
            clickOpens: false,
            parseDate: function(datestr, formatStr) {
                let checkVal = datestr.replace(/:60(?!.*:60)/, ':59');
                let dt;
                if (formatStr === "Y-m-d, h:i:S K") {
                    dt = DateTime.fromFormat(checkVal, "yyyy-MM-dd, hh:mm:ss a");
                } else if (formatStr === "Y-m-d, H:i:S") {
                    dt = DateTime.fromFormat(checkVal, "yyyy-MM-dd, HH:mm:ss");
                } else {
                    dt = DateTime.fromISO(checkVal);
                }
                return dt.isValid ? dt.toJSDate() : undefined;
            },
            formatDate: function(date, formatStr) {
                if (formatStr === "Y-m-d, h:i:S K") {
                    return DateTime.fromJSDate(date).toFormat("yyyy-MM-dd, hh:mm:ss a");
                } else if (formatStr === "Y-m-d, H:i:S") {
                    return DateTime.fromJSDate(date).toFormat("yyyy-MM-dd, HH:mm:ss");
                }
                return DateTime.fromJSDate(date).toFormat("yyyy-MM-dd'T'HH:mm:ss");
            },
            onChange: function(selectedDates, dateStr, instance) {
                instance.element.dispatchEvent(new Event('input', { bubbles: true }));
            },
            onValueUpdate: function(selectedDates, dateStr, instance) {
                forceLeadingZero(instance);
                if (instance.altInput) {
                    if (instance.altInput.dataset.hasLeap60 === "true" && instance.altInput.value.includes(":59")) {
                        instance.altInput.value = instance.altInput.value.replace(/:59(?!.*:59)/, ":60");
                    }
                    const is24hr = document.getElementById('toggle24hr').checked;
                    const template = is24hr ? "yyyy-mm-dd, HH:mm:ss" : "yyyy-mm-dd, hh:mm:ss _M";
                    const currentAltValue = instance.altInput.value;
                    if (currentAltValue.includes(":60")) {
                        instance.altInput.style.color = '#E0CBB9';
                    } else if (currentAltValue && currentAltValue !== template) {
                        instance.altInput.style.color = '#E0CBB9';
                    } else {
                        instance.altInput.style.color = '#634E34';
                    }
                }
            },
            onOpen: function(selectedDates, dateStr, instance) {
                forceLeadingZero(instance);
            }
        };
        const restrictDateInputKeys = (e) => {
            const input = e.target;
            const is24hr = document.getElementById('toggle24hr').checked;
            const template = is24hr ? "yyyy-mm-dd, HH:mm:ss" : "yyyy-mm-dd, hh:mm:ss _M";
            const controlKeys = ['Tab', 'ArrowLeft', 'ArrowRight', 'Enter', 'Escape'];
            if (controlKeys.includes(e.key) || e.ctrlKey || e.metaKey) return;
            e.preventDefault(); 
            let val = input.value;
            if (!val) {
                val = template;
                input.value = val;
                input.setSelectionRange(0, 0);
            }
            let start = input.selectionStart;
            let end = input.selectionEnd;
            if (start !== end) {
                if (e.key === 'Backspace' || e.key === 'Delete') {
                    let chars = val.split('');
                    for (let i = start; i < end; i++) chars[i] = template[i]; 
                    input.value = chars.join('');
                    input.setSelectionRange(start, start);
                    input.dispatchEvent(new Event('input', { bubbles: true }));
                    return;
                } else if (/^[0-9]$/.test(e.key) || (!is24hr && /^[apAP]$/.test(e.key))) {
                    let chars = val.split('');
                    for (let i = start; i < end; i++) chars[i] = template[i]; 
                    val = chars.join('');
                    input.value = val;
                    input.setSelectionRange(start, start);
                    end = start;
                } else {
                    return; 
                }
            }
            const isFormatChar = (i) => [4, 7, 10, 11, 14, 17, (is24hr ? -1 : 20)].includes(i);
            if (e.key === 'Backspace') {
                if (start > 0) {
                    let idx = start - 1;
                    while (idx >= 0 && isFormatChar(idx)) idx--;
                    if (idx >= 0) {
                        let chars = val.split('');
                        if (!is24hr && idx >= 21) {
                            chars[21] = '_';
                            chars[22] = 'M'; 
                            idx = 21;
                        } else {
                            chars[idx] = template[idx]; 
                        }
                        input.value = chars.join('');
                        input.setSelectionRange(idx, idx);
                        input.dispatchEvent(new Event('input', { bubbles: true }));
                    }
                }
                return;
            }
            if (e.key === 'Delete') {
                if (start < val.length) {
                    let idx = start;
                    while (idx < val.length && isFormatChar(idx)) idx++;
                    if (idx < val.length) {
                        let chars = val.split('');
                        if (!is24hr && idx >= 21) {
                            chars[21] = '_';
                            chars[22] = 'M';
                            input.setSelectionRange(21, 21);
                        } else {
                            chars[idx] = template[idx];
                            input.setSelectionRange(idx + 1, idx + 1);
                        }
                        input.value = chars.join('');
                        input.dispatchEvent(new Event('input', { bubbles: true }));
                    }
                }
                return;
            }
            if (/^[0-9]$/.test(e.key)) {
                let idx = start;
                while (idx < val.length && isFormatChar(idx)) idx++; 
                if (idx < val.length && /[ymdhHs]/.test(template[idx])) {
                    if (!is24hr && idx >= 21) return;
                    let chars = val.split('');
                    let keyDigit = parseInt(e.key);
                    const tz = input.closest('.milestone-container') ? document.getElementById('targetTzLocation').value : document.getElementById('tzLocation').value;
                    const isLeapMinCurrent = isLeapSecondMinute(val, tz, is24hr);
                    let autoPad = false;
                    if (template[idx] === 'm' && idx === 5 && keyDigit > 1) autoPad = true; 
                    if (template[idx] === 'd' && idx === 8 && keyDigit > 3) autoPad = true; 
                    if (is24hr && template[idx] === 'H' && idx === 12 && keyDigit > 2) autoPad = true; 
                    if (!is24hr && template[idx] === 'h' && idx === 12 && keyDigit > 1) autoPad = true; 
                    if (template[idx] === 'm' && idx === 15 && keyDigit > 5) autoPad = true; 
                    if (template[idx] === 's' && idx === 18 && keyDigit > 5) {
                        if (!(keyDigit === 6 && isLeapMinCurrent)) autoPad = true; 
                    } 
                    if (autoPad) {
                        chars[idx] = '0';
                        chars[idx + 1] = e.key;
                    } else {
                        chars[idx] = e.key; 
                    }
                    const testStr = chars.join('');
                    const isLeapMinProposed = isLeapSecondMinute(testStr, tz, is24hr);
                    const m1 = testStr[5], m2 = testStr[6];
                    const d1 = testStr[8], d2 = testStr[9];
                    const h1 = testStr[12], h2 = testStr[13];
                    const mn1 = testStr[15], mn2 = testStr[16];
                    const s1 = testStr[18], s2 = testStr[19];
                    let isInvalid = false;
                    if (m1 !== 'm' && m1 > '1') isInvalid = true;
                    if (m1 !== 'm' && m2 !== 'm' && (parseInt(m1+m2) < 1 || parseInt(m1+m2) > 12)) isInvalid = true;
                    if (d1 !== 'd' && d1 > '3') isInvalid = true;
                    if (d1 !== 'd' && d2 !== 'd' && (parseInt(d1+d2) < 1 || parseInt(d1+d2) > 31)) isInvalid = true;
                    if (is24hr) {
                        if (h1 !== 'H' && h1 > '2') isInvalid = true;
                        if (h1 !== 'H' && h2 !== 'H' && parseInt(h1+h2) > 23) isInvalid = true;
                    } else {
                        if (h1 !== 'h' && h1 > '1') isInvalid = true;
                        if (h1 !== 'h' && h2 !== 'h' && (parseInt(h1+h2) < 1 || parseInt(h1+h2) > 12)) isInvalid = true;
                    }
                    if (mn1 !== 'm' && mn1 > '5') isInvalid = true;
                    if (mn1 !== 'm' && mn2 !== 'm' && parseInt(mn1+mn2) > 59) isInvalid = true;
                    let wasAlready6_ = (val[18] === '6');
                    let wasAlready60 = (val.substring(18, 20) === '60');
                    if (s1 !== 's') {
                        if (s1 > '5' && !(s1 === '6' && (isLeapMinProposed || (wasAlready6_ && idx !== 18)))) isInvalid = true;
                    }

        document.getElementById('r-week').innerText  = f(totalWeeks);
        document.getElementById('r-month').innerText = f(totalMonths);
        document.getElementById('r-year').innerText  = f(totalYears);
        const dd = adjustedNow.diff(bd, ['years', 'months', 'weeks', 'days', 'hours', 'minutes', 'seconds']);
        let displaySeconds = dd.seconds;
        let displayMinutes = dd.minutes;
        let displayHours = dd.hours;
        let displayDays = dd.days;
        const p = (val, unit) => { const num = Math.trunc(val) + 0; return new Intl.NumberFormat(navigator.language, { style: 'unit', unit: unit, unitDisplay: 'long', numberingSystem: 'latn' }).format(num); };
        const datePart = `${p(dd.years, 'year')}, ${p(dd.months, 'month')}, ${p(dd.weeks, 'week')}, ${p(displayDays, 'day')}`;
        const timePart = `${p(displayHours, 'hour')}, ${p(displayMinutes, 'minute')}, ${p(displaySeconds, 'second')}`;
        const detailSafeLimit = 28; 
        let dateScale = datePart.length > detailSafeLimit ? Math.max(detailSafeLimit / datePart.length, 0.55) : 1;
        let timeScale = timePart.length > detailSafeLimit ? Math.max(detailSafeLimit / timePart.length, 0.55) : 1;
        let detailUniformScale = Math.min(dateScale, timeScale);
        const monoSafeLimit = 28; 
        let curDateScale = curDateStr.length > monoSafeLimit ? Math.max(monoSafeLimit / curDateStr.length, 0.60) : 1;
        let curTimeScale = curTimeStr.length > monoSafeLimit ? Math.max(monoSafeLimit / curTimeStr.length, 0.60) : 1;
        let curUniformScale = Math.min(curDateScale, curTimeScale);
        if (window.innerWidth > 1366) {
            detailUniformScale = 1;
            curUniformScale = 1;
        }
        document.getElementById('r-detailed').innerHTML = `<span class="detail-date" style="font-size: ${detailUniformScale}em;">${datePart}, </span><span class="detail-time" style="font-size: ${detailUniformScale}em;">${timePart}</span>`;
        document.getElementById('r-current-time').innerHTML = `<span class="detail-date" style="font-size: ${curUniformScale}em;">${curDateStr}, </span> <span class="detail-time" style="font-size: ${curUniformScale}em;">${curTimeStr}</span>`;
        document.getElementById('r-time-offset').innerHTML = `<span style="font-size: ${curUniformScale}em;">(UTC ${now.toFormat("ZZ")})</span>`;
    }
    document.getElementById('btn-now').addEventListener('click', () => {
        const now = DateTime.local().plus({ milliseconds: timeOffset }).setZone(document.getElementById('tzLocation').value).startOf('second');
        const bdInput = document.getElementById('birthdatetime');
        if (bdInput._flatpickr) {
            bdInput._flatpickr.setDate(now.toJSDate(), true);
        } else {
            bdInput.value = now.toFormat("yyyy-MM-dd'T'HH:mm:ss");
        }
        calculate(); refreshAllMilestones();
    });
    document.getElementById('btn-clear').addEventListener('click', () => {
        const bdInput = document.getElementById('birthdatetime');
        if (bdInput._flatpickr) {
            bdInput._flatpickr.clear();
        } else {
            bdInput.value = '';
        }
        syncMilestones(null, null);
        calculate();
    });
    document.getElementById('birthdatetime').addEventListener('input', () => { calculate(); refreshAllMilestones(); });
    document.getElementById('tzLocation').addEventListener('change', () => { calculate(); refreshAllMilestones(); });
    document.getElementById('targetTzLocation').addEventListener('change', () => { calculate(); refreshAllMilestones(); });
    document.getElementById('toggleCommas').addEventListener('change', () => { calculate(); refreshAllMilestones(); });
    function updateTimeFormat() {
        const is24hr = document.getElementById('toggle24hr').checked;
        const newAltFormat = is24hr ? "Y-m-d, H:i:S" : "Y-m-d, h:i:S K";
        const placeholderStr = is24hr ? "yyyy-mm-dd, HH:mm:ss" : "yyyy-mm-dd, hh:mm:ss _M";
        const mainInput = document.getElementById('birthdatetime');
        if (mainInput && mainInput._flatpickr) {
            const currentDate = mainInput._flatpickr.selectedDates[0];
            mainInput._flatpickr.set('time_24hr', is24hr);
            mainInput._flatpickr.set('altFormat', newAltFormat);
            mainInput._flatpickr.altInput.placeholder = placeholderStr; 
            if (currentDate) {
                mainInput._flatpickr.setDate(currentDate, false);
                if (mainInput._flatpickr.altInput.dataset.hasLeap60 === "true" && currentDate.getSeconds() === 59) {
                    mainInput._flatpickr.altInput.value = mainInput._flatpickr.altInput.value.replace(/:59(?!.*:59)/, ":60");
                }
            } else if (mainInput.value) {
                const dt = DateTime.fromISO(mainInput.value);
                if (dt.isValid) {
                    mainInput._flatpickr.setDate(dt.toJSDate(), false);
                    if (mainInput._flatpickr.altInput.dataset.hasLeap60 === "true" && dt.second === 59) {
                        mainInput._flatpickr.altInput.value = mainInput._flatpickr.altInput.value.replace(/:59(?!.*:59)/, ":60");
                    }
                }
            }
        }
        document.querySelectorAll('.milestone-container .ms-date-input').forEach(input => {
            if (input._flatpickr) {
                const savedIso = input.value;
                input._flatpickr.set('time_24hr', is24hr);
                input._flatpickr.set('altFormat', newAltFormat);
                input._flatpickr.altInput.placeholder = placeholderStr;
                if (savedIso) {
                    const dt = DateTime.fromISO(savedIso);
                    if (dt.isValid) {
                        input.value = savedIso;
                        let newDisplay = dt.toFormat(is24hr ? "yyyy-MM-dd, HH:mm:ss" : "yyyy-MM-dd, hh:mm:ss a");
                        if (input._flatpickr.altInput.dataset.hasLeap60 === "true" && dt.second === 59) {
                            newDisplay = newDisplay.replace(/:59(?!.*:59)/, ":60");
                        }
                        input._flatpickr.altInput.value = newDisplay;
                    }
                }
            }
        });
        calculate();
        refreshAllMilestones(); 
    }
    document.getElementById('toggle24hr').addEventListener('change', updateTimeFormat);
    const currentYearNum = new Date().getFullYear();
    const newYearString = `${currentYearNum}-01-01T00:00:00`;
    const bdInput = document.getElementById('birthdatetime');
    if (bdInput._flatpickr) {
        bdInput._flatpickr.setDate(newYearString, true);
    } else {
        bdInput.value = newYearString;
    }
    calculate();
    refreshAllMilestones();
    fetchLiveLeapSeconds().then(() => {
        calculate(); 
        refreshAllMilestones(); 
    });
    startLocalEngine();
    document.getElementById("current-year").innerText = new Date().getFullYear();
        const yearText = document.getElementById("current-year");
            if (yearText) {
            yearText.innerText = new Date().getFullYear();
        }
</script>
</body>
