<!DOCTYPE html>
<html lang="en-US">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-4Z2LPX6TMP"></script>
    <link rel="canonical" href="https://www.timeodometer.app/" />

</head>
<body>
<div class="container">
    <div class="half-container">
    <h2>Time&nbsp;Odometer</h2>
    <p class="privacy-notice">🔒&nbsp;Private &amp; Secure</p>
    <div id="sync-warning" class="sync-warning">⚠️&nbsp;Failed connection. Using device clock.</div>
    <div class="input-group">
        <label for="birthdatetime">Enter Date and Time:</label>
        <div class="main-date-group">
            <div class="input-dow-wrapper">
                <input type="datetime-local" class="ms-date-input" id="birthdatetime" step="1" min="0001-01-01T00:00:00" max="9999-12-31T23:59:59">
                <span class="main-dow" id="main-dow" style="color: #634E34;">EEE</span>
            </div>

                <button type="button" id="btn-now" class="btn-now">Now</button>
                <button type="button" id="btn-clear" class="btn-clear">Clear</button>
            </div>
        </div>
    </div>
    <div class="dropdown-row">
        <div class="input-group">
            <label for="tzLocation">Origin Location:<span class="tooltip-container">
                    <svg class="tooltip-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                        <line x1="12" y1="17" x2="12.01" y2="17"></line>
                    </svg>
                    <span class="tooltip-text">Event location (e.g. your place of birth).</span>
                </span>
            </label>
            <select id="tzLocation"></select>
        </div>
        <div class="input-group">
            <label for="targetTzLocation">Target Location:<span class="tooltip-container">
                    <svg class="tooltip-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                        <line x1="12" y1="17" x2="12.01" y2="17"></line>
                    </svg>
                    <span class="tooltip-text">For milestones (e.g. your current place).</span>
                </span>
            </label>
            <select id="targetTzLocation"></select>
        </div>
    </div>
            <div class="settings-panel">
            <label class="toggle-wrapper"><input type="checkbox" id="toggleCommas" checked>Separator</label>
            <label class="toggle-wrapper">24-hour<input type="checkbox" id="toggle24hr"></label>
        </div>
        <div class="donation-section">
    <p class="donation-text">Like it? Support the project!</p>
    <a href="https://ko-fi.com/yaguarundi" target="_blank" rel="noopener noreferrer" title="Support me on Ko-fi.">
        <img src="kofilogo.png" alt="Ko-fi" class="kofi-icon">
    </a>
    </div>
    </div>
    <div class="results half-container" id="resultsPanel">
        <div class="row" data-unit="seconds">
            <div class="row-main">
                <span class="row-label">Seconds</span>
                <span id="r-sec" class="bold-number">0</span>
            </div>
            <div class="milestone-container">
                <div class="ms-date-group">
                    <input type="datetime-local" class="ms-date-input" step="1" title="Target Date">
                    <span class="ms-dow" style="color: #634E34;">EEE</span>
                </div>
                <input type="text" class="ms-input" placeholder="&plusmn;0">
            </div>
        </div>
        <div class="row" data-unit="minutes">
            <div class="row-main"><span class="row-label">Minutes</span> <span id="r-min" class="bold-number">0</span></div>
            <div class="milestone-container"><div class="ms-date-group"><input type="datetime-local" class="ms-date-input" step="1"><span class="ms-dow" style="color: #634E34;">EEE</span></div><input type="text" class="ms-input" placeholder="&plusmn;0.0000"></div>
        </div>
        <div class="row" data-unit="hours">
            <div class="row-main"><span class="row-label">Hours</span> <span id="r-hour" class="bold-number">0</span></div>
            <div class="milestone-container"><div class="ms-date-group"><input type="datetime-local" class="ms-date-input" step="1"><span class="ms-dow" style="color: #634E34;">EEE</span></div><input type="text" class="ms-input" placeholder="&plusmn;0.0000"></div>
        </div>
        <div class="row" data-unit="days">
            <div class="row-main"><span class="row-label">Days</span> <span id="r-day" class="bold-number">0</span></div>
            <div class="milestone-container"><div class="ms-date-group"><input type="datetime-local" class="ms-date-input" step="1"><span class="ms-dow" style="color: #634E34;">EEE</span></div><input type="text" class="ms-input" placeholder="&plusmn;0.0000"></div>
        </div>
        <div class="row" data-unit="weeks">
            <div class="row-main"><span class="row-label">Weeks</span> <span id="r-week" class="bold-number">0</span></div>
            <div class="milestone-container"><div class="ms-date-group"><input type="datetime-local" class="ms-date-input" step="1"><span class="ms-dow" style="color: #634E34;">EEE</span></div><input type="text" class="ms-input" placeholder="&plusmn;0.0000"></div>
        </div>
        <div class="row" data-unit="months">
            <div class="row-main"><span class="row-label">Months</span> <span id="r-month" class="bold-number">0</span></div>
            <div class="milestone-container"><div class="ms-date-group"><input type="datetime-local" class="ms-date-input" step="1"><span class="ms-dow" style="color: #634E34;">EEE</span></div><input type="text" class="ms-input" placeholder="&plusmn;0.0000"></div>
        </div>
        <div class="row" data-unit="years">
            <div class="row-main"><span class="row-label">Years</span> <span id="r-year" class="bold-number">0</span></div>
            <div class="milestone-container"><div class="ms-date-group"><input type="datetime-local" class="ms-date-input" step="1"><span class="ms-dow" style="color: #634E34;">EEE</span></div><input type="text" class="ms-input" placeholder="&plusmn;0.0000"></div>
        </div>
    </div> <div class="results half-container" id="extraPanel">
        <div class="detailed-row" id="r-detailed">Loading...</div>
        <div class="current-time" id="r-current-time">--</div>
        <div class="time-offset" id="r-time-offset"></div>
        <div class="footer">
        <a href="https://linktr.ee/yaguarundi" target="_blank" rel="noopener noreferrer" title="Links">
            <span class="linktree-icon"></span>
        </a>
        <p class="copyright">&copy; <span id="current-year">2026</span>&nbsp;Yago&nbsp;Yaguarundi.&nbsp;All rights reserved.</p>
    </div>
    </div>
    </div>
</div>
<script>
    const DateTime = luxon.DateTime;
    luxon.Settings.defaultLocale = "en-US";
    let intervalId;
    let timeOffset = 0; 
    let syncRetries = 0;
    const MAX_SYNC_RETRIES = 1;
    const handleManualTyping = (e, instance) => {
    const val = e.target.value.trim();
    const is24hr = document.getElementById('toggle24hr').checked;
    const format = is24hr ? "yyyy-MM-dd, HH:mm:ss" : "yyyy-MM-dd, hh:mm:ss a";
    const parsed = DateTime.fromFormat(val, format);
    if (parsed.isValid) {
        const iso = parsed.toFormat("yyyy-MM-dd'T'HH:mm:ss");
        instance.element.value = iso;
        instance.element.dispatchEvent(new Event('input', { bubbles: true }));
    } else {
        instance.element.value = ""; 
        instance.element.dispatchEvent(new Event('input', { bubbles: true }));
        if (val === "") {
            instance.clear();
        }
    }
};
   window.addEventListener('DOMContentLoaded', () => {
        const nativeInputFont = window.getComputedStyle(document.getElementById('birthdatetime')).fontFamily;
        const tooltips = document.querySelectorAll('.tooltip-container');
        let activeTooltip = null;
        let shieldTimer = null;
        tooltips.forEach(container => {
            ['pointerdown', 'touchstart', 'click'].forEach(evt => {
                container.addEventListener(evt, (e) => {
                    if (window.innerWidth > 1366) return;
                    e.preventDefault();
                    e.stopPropagation();
                    if (evt === 'pointerdown') {
                        if (activeTooltip) {
                            activeTooltip.classList.remove('is-open');
                            activeTooltip.closest('.input-group').style.zIndex = '2'; 
                        }

                        if (activeTooltip === container) {
                            activeTooltip = null;
                        } else {
                            container.classList.add('is-open');
                            container.closest('.input-group').style.zIndex = '999999'; 
                            activeTooltip = container;
                        }
                    }
                });
            });
        });
        ['pointerdown', 'touchstart', 'click'].forEach(evt => {
            document.addEventListener(evt, (e) => {
                if (window.innerWidth > 1366) return;
                if (shieldTimer) {
                    e.preventDefault();
                    e.stopPropagation();
                    return;
                }
                if (activeTooltip && !activeTooltip.contains(e.target)) {
                    e.preventDefault();
                    e.stopPropagation();
                    activeTooltip.classList.remove('is-open');
                    activeTooltip.closest('.input-group').style.zIndex = '2'; 
                    activeTooltip = null;
                    shieldTimer = setTimeout(() => { shieldTimer = null; }, 300);
                }
            }, { capture: true, passive: false });
        });
        document.querySelectorAll('.main-dow, .ms-dow').forEach(span => {
            span.style.fontFamily = nativeInputFont;
            span.style.fontWeight = "bold";
        });
        function forceLeadingZero(instance) {
            if (instance.hourElement) {
                if (instance.hourElement.type !== 'text') instance.hourElement.type = 'text'; 
                instance.hourElement.value = String(instance.hourElement.value).padStart(2, '0');
            }
        }
        const fpConfig = {
            enableTime: true,
            enableSeconds: true,
            dateFormat: "Y-m-d\\TH:i:S", 
            altInput: true,
            altFormat: "Y-m-d, h:i:S K", 
            altInputClass: "ms-date-input",
            minDate: "0001-01-01",
            disableMobile: "true",
            allowInput: true,
            clickOpens: false,
            formatDate: function(date, formatStr) {
                if (formatStr === "Y-m-d, h:i:S K") {
                    return DateTime.fromJSDate(date).toFormat("yyyy-MM-dd, hh:mm:ss a");
                } else if (formatStr === "Y-m-d, H:i:S") {
                    return DateTime.fromJSDate(date).toFormat("yyyy-MM-dd, HH:mm:ss");
                }
                return DateTime.fromJSDate(date).toFormat("yyyy-MM-dd'T'HH:mm:ss");
            },
            onChange: function(selectedDates, dateStr, instance) {
                instance.element.dispatchEvent(new Event('input', { bubbles: true }));
            },
            onValueUpdate: function(selectedDates, dateStr, instance) {
                forceLeadingZero(instance);
            },
            onOpen: function(selectedDates, dateStr, instance) {
                forceLeadingZero(instance);
            }
        };
        document.querySelectorAll('.ms-date-input').forEach(input => {
            input.addEventListener('keydown', function(e) {
                const allowedKeys = ['Backspace', 'Tab', 'ArrowLeft', 'ArrowRight', 'Delete', 'Enter'];
                if (allowedKeys.includes(e.key) || e.ctrlKey || e.metaKey) return;
                if (!/^[0-9\-:, APMampm]$/.test(e.key)) {
                    e.preventDefault();
                }
            });
        });
        flatpickr("#birthdatetime", {
            ...fpConfig,
            onReady: function(selectedDates, dateStr, instance) {
                instance.altInput.style.backgroundColor = "transparent";
                instance.altInput.style.cursor = "text";
                instance.altInput.placeholder = document.getElementById('toggle24hr').checked ? "yyyy-mm-dd, HH:mm:ss" : "yyyy-mm-dd, hh:mm:ss AM/PM";
                instance.altInput.addEventListener('input', (e) => handleManualTyping(e, instance));
                forceLeadingZero(instance);
                if (instance.hourElement) {
                    instance.hourElement.addEventListener('input', () => forceLeadingZero(instance));
                }
            }
        });
        flatpickr(".milestone-container .ms-date-input", {
            ...fpConfig,
            onReady: function(selectedDates, dateStr, instance) {
                instance.altInput.style.cursor = "text";
                instance.altInput.placeholder = document.getElementById('toggle24hr').checked ? "yyyy-mm-dd, HH:mm:ss" : "yyyy-mm-dd, hh:mm:ss AM/PM";
                instance.altInput.addEventListener('input', (e) => handleManualTyping(e, instance));
                forceLeadingZero(instance);
                if (instance.hourElement) {
                    instance.hourElement.addEventListener('input', () => forceLeadingZero(instance));
                }
            }
        });
       document.querySelectorAll('.row').forEach(row => {
            const unit = row.getAttribute('data-unit'); 
            const intlUnit = unit.slice(0, -1); 
            try {
                const parts = new Intl.NumberFormat(navigator.language, { 
                    style: 'unit', 
                    unit: intlUnit, 
                    unitDisplay: 'long' 
                }).formatToParts(10);
                const unitPart = parts.find(part => part.type === 'unit');
                if (unitPart) {
                    const label = row.querySelector('.row-label');
                    label.innerText = unitPart.value;
                }
            } catch (e) {
                console.warn("Could not translate unit:", unit);
            }
        });
    });
   const tzSelect = document.getElementById('tzLocation');
    const targetTzSelect = document.getElementById('targetTzLocation');
    const timeZones = Intl.supportedValuesOf('timeZone').filter(tz => tz !== 'UTC');
    timeZones.unshift('UTC');
    const userTz = Intl.DateTimeFormat().resolvedOptions().timeZone;
    timeZones.forEach(tz => {
        const option1 = document.createElement('option');
        option1.value = tz; option1.textContent = tz.replace(/_/g, ' ');
        const option2 = option1.cloneNode(true);
        if (tz === userTz) { option1.selected = true; option2.selected = true; }
        tzSelect.appendChild(option1);
        targetTzSelect.appendChild(option2);
    });
    async function syncTime() {
        if (syncRetries >= MAX_SYNC_RETRIES) {
            document.getElementById('sync-warning').style.display = 'block';
            return;
        }
        try {
            const start = performance.now();
            const response = await fetch('https://timeapi.io/api/Time/current/zone?timeZone=UTC', { cache: 'no-store' });
            if (!response.ok) throw new Error("API Error");
            const data = await response.json();
            const serverMillis = DateTime.fromISO(data.dateTime, { zone: 'UTC' }).toMillis();
            timeOffset = (serverMillis + (performance.now() - start) / 2) - Date.now();
            document.getElementById('sync-warning').style.display = 'none';
            } catch (err) { syncRetries++;
            if (syncRetries >= MAX_SYNC_RETRIES) {
                document.getElementById('sync-warning').style.display = 'block';
            } else {
                setTimeout(syncTime, 1500 * syncRetries);
            }
        }
    }
    function startLocalEngine() {
        calculate();
        if (intervalId) clearInterval(intervalId);
        intervalId = setInterval(calculate, 1000);
        syncTime();
    }
    const leapSecondDates = ["1972-06-30T23:59:59Z", "1972-12-31T23:59:59Z", "1973-12-31T23:59:59Z", "1974-12-31T23:59:59Z", "1975-12-31T23:59:59Z", "1976-12-31T23:59:59Z", "1977-12-31T23:59:59Z", "1978-12-31T23:59:59Z", "1979-12-31T23:59:59Z", "1981-06-30T23:59:59Z", "1982-06-30T23:59:59Z", "1983-06-30T23:59:59Z", "1985-06-30T23:59:59Z", "1987-12-31T23:59:59Z", "1989-12-31T23:59:59Z", "1990-12-31T23:59:59Z", "1992-06-30T23:59:59Z", "1993-06-30T23:59:59Z", "1994-06-30T23:59:59Z", "1995-12-31T23:59:59Z", "1997-06-30T23:59:59Z", "1998-12-31T23:59:59Z", "2005-12-31T23:59:59Z", "2008-12-31T23:59:59Z", "2012-06-30T23:59:59Z", "2015-06-30T23:59:59Z", "2016-12-31T23:59:59Z"].map(iso => DateTime.fromISO(iso));
    function countLeapSeconds(startDateTime, endDateTime) { return leapSecondDates.filter(ls => ls >= startDateTime && ls <= endDateTime).length; }
    function syncMilestones(targetDateISO, activeInput) {
        const rows = document.querySelectorAll('.row');
        if (!targetDateISO) {
            rows.forEach(row => {
                const di = row.querySelector('.ms-date-input.flatpickr-input') || row.querySelector('.ms-date-input');
                const ai = row.querySelector('.ms-input');
                const ds = row.querySelector('.ms-dow');
                if (di !== activeInput) {
                    if (di && di._flatpickr) {
                        di._flatpickr.setDate(null, false);
                    } else {
                        di.value = '';
                    }
                }
                if (ai !== activeInput) ai.value = '';
                ds.innerText = 'EEE';
                ds.style.color = '#634E34';
            });
            return;
        }
        const originVal = document.getElementById('birthdatetime').value;
        const originTz = document.getElementById('tzLocation').value;
        const targetTz = document.getElementById('targetTzLocation').value;
        const originDate = DateTime.fromISO(originVal, { zone: originTz }).startOf('second');
        const targetDate = DateTime.fromISO(targetDateISO, { zone: targetTz }).startOf('second');
        if (!originDate.isValid || !targetDate.isValid) return;
        rows.forEach(row => {
            const unit = row.getAttribute('data-unit');
            const di = row.querySelector('.ms-date-input.flatpickr-input') || row.querySelector('.ms-date-input');
            const ai = row.querySelector('.ms-input');
            const ds = row.querySelector('.ms-dow');
            ds.innerText = targetDate.toFormat("EEE").toUpperCase();
            ds.style.color = '#E0CBB9';
            if (di !== activeInput) {
                const newIso = targetDate.toFormat("yyyy-MM-dd'T'HH:mm:ss");
                if (di && di._flatpickr) {
                    const is24hr = document.getElementById('toggle24hr').checked;
                    di.value = newIso;
                    di._flatpickr.altInput.value = targetDate.toFormat(is24hr ? "yyyy-MM-dd, HH:mm:ss" : "yyyy-MM-dd, hh:mm:ss a");
                } else {
                    di.value = newIso;
                }
            }
            ds.innerText = targetDate.toFormat("EEE").toUpperCase();
            if (ai !== activeInput) {
                let amt = 0;
                if (unit === 'seconds') {
                    let ms = targetDate.toMillis() - originDate.toMillis();
                    let ls = countLeapSeconds(DateTime.fromMillis(Math.min(originDate.toMillis(), targetDate.toMillis())), DateTime.fromMillis(Math.max(originDate.toMillis(), targetDate.toMillis())));
                    amt = targetDate < originDate ? Math.floor(ms/1000) - ls : Math.floor(ms/1000) + ls;
                } else { amt = parseFloat(targetDate.diff(originDate, unit)[unit].toFixed(4)); }
                const useCommas = document.getElementById('toggleCommas').checked;
                let s = Math.abs(amt).toString().split('.');
                let formattedInteger = useCommas ? parseInt(s[0], 10).toLocaleString('en-US') : s[0];
                let res = formattedInteger + (s.length > 1 ? '.' + s[1] : '');
                ai.value = (amt < 0 ? '-' : '') + res;
            }
        });
    }
    function refreshAllMilestones() {
        let anchor = null;
        const inputs = document.querySelectorAll('.milestone-container .ms-date-input.flatpickr-input');
        const searchList = inputs.length > 0 ? inputs : document.querySelectorAll('.milestone-container .ms-date-input');
        
        searchList.forEach(i => { 
            if (!anchor && i.value) anchor = i.value; 
        });
        syncMilestones(anchor, null);
    }
    document.querySelectorAll('.row').forEach(row => {
        const unit = row.getAttribute('data-unit');
        const ai = row.querySelector('.ms-input');
        const di = row.querySelector('.ms-date-input');
        ai.addEventListener('input', function() {
            let val = this.value; 
            if (!val || val === '-' || val === '') { syncMilestones(null, this); return; }
            let cursor = this.selectionStart;
        let beforeCursor = val.substring(0, cursor);
        let digitsBefore = (unit === 'seconds') ? beforeCursor.replace(/\D/g, '').length : beforeCursor.replace(/[^\d.]/g, '').length;
        let isNeg = val.trim().startsWith('-');
        let rawStr = (unit === 'seconds') ? val.replace(/\D/g, '') : val.replace(/[^\d.]/g, '');
        let p = rawStr.split('.'); 
        if (p.length > 2) p = [p[0], p.slice(1).join('')];       
        if (p[0] !== '') {
            const useCommas = document.getElementById('toggleCommas').checked;
            const formattedBase = useCommas ? parseInt(p[0], 10).toLocaleString('en-US') : p[0];
            this.value = (isNeg ? '-' : '') + formattedBase + (p.length > 1 ? '.' + p[1] : '');
        } else if (p.length > 1) {
            this.value = (isNeg ? '-' : '') + '0.' + p[1];
        } else {
            this.value = isNeg ? '-' : '';
        }
        let newCursor = 0;
        let count = 0;
        let validRegex = (unit === 'seconds') ? /\d/ : /[\d.]/;

        if (digitsBefore === 0) {
            newCursor = (isNeg && cursor > 0) ? 1 : 0;
        } else {
            for (let i = 0; i < this.value.length; i++) {
                if (validRegex.test(this.value[i])) count++;
                if (count === digitsBefore) {
                    newCursor = i + 1;
                    break;
                }
            }
        }
        if (count > 0 && count < digitsBefore) newCursor = this.value.length;
        this.setSelectionRange(newCursor, newCursor);  
            const tVal = parseFloat(this.value.replace(/,/g, '')); 
            if (isNaN(tVal)) return;
            const originVal = document.getElementById('birthdatetime').value;
            const originDate = DateTime.fromISO(originVal, { zone: document.getElementById('tzLocation').value }).startOf('second');
            let td;
            if (unit === 'seconds') {
                let ms = originDate.toMillis() + (tVal * 1000);
                for(let i=0; i<3; i++) {
                    let ls = countLeapSeconds(DateTime.fromMillis(Math.min(originDate.toMillis(), ms)), DateTime.fromMillis(Math.max(originDate.toMillis(), ms)));
                    ms = tVal < 0 ? originDate.toMillis() + (tVal*1000) + (ls*1000) : originDate.toMillis() + (tVal*1000) - (ls*1000);
                }
                td = DateTime.fromMillis(ms).setZone(document.getElementById('targetTzLocation').value);
            } else { 
                td = originDate.plus({[unit]: tVal}).setZone(document.getElementById('targetTzLocation').value); 
            }
            if (!td.isValid || td.year > 9999 || td.year < 0001) {
            syncMilestones(null, this);
            return;
        }
            syncMilestones(td.toFormat("yyyy-MM-dd'T'HH:mm:ss"), this);
        });
        di.addEventListener('input', function() { 
            syncMilestones(this.value || null, this); 
        });
    });
    function calculate() {
        const iv = document.getElementById('birthdatetime').value;
        const tz = document.getElementById('tzLocation').value;
        const rp = document.getElementById('resultsPanel');
        const ep = document.getElementById('extraPanel');
        const em = document.getElementById('errorMsg');
        const md = document.getElementById('main-dow');
        const uc = document.getElementById('toggleCommas').checked;
        const u24 = document.getElementById('toggle24hr').checked;
        if (!iv) { rp.style.display = 'none'; ep.style.display = 'none'; md.innerText = 'EEE'; md.style.color = '#634E34'; return; }
        const bd = DateTime.fromISO(iv, { zone: tz }).startOf('second');
        if (bd.isValid && bd.year >= 1) { md.innerText = bd.toFormat("EEE").toUpperCase(); md.style.color = '#E0CBB9'; } else { md.innerText = 'EEE'; md.style.color = '#634E34'; }
        md.innerText = (bd.isValid && bd.year >= 1) ? bd.toFormat("EEE").toUpperCase() : 'EEE';
        const now = DateTime.local().plus({ milliseconds: timeOffset }).setZone(tz).startOf('second');
        if (!bd.isValid || bd.year < 1 || bd.year > 9999) { rp.style.display = 'none'; ep.style.display = 'none'; return; }
        rp.style.display = 'flex'; ep.style.display = 'flex';
        const ms = now.diff(bd).toMillis();
        const ls = countLeapSeconds(DateTime.fromMillis(Math.min(bd.toMillis(), now.toMillis())), DateTime.fromMillis(Math.max(bd.toMillis(), now.toMillis())));
        const ps = ms < 0 ? Math.floor(ms/1000) - ls : Math.floor(ms/1000) + ls;
        const f = (n) => uc ? (Math.trunc(n) + 0).toLocaleString('en-US') : (Math.trunc(n) + 0).toString();
        document.getElementById('r-sec').innerText = f(ps);
        document.getElementById('r-min').innerText = f(now.diff(bd, 'minutes').minutes);
        document.getElementById('r-hour').innerText = f(now.diff(bd, 'hours').hours);
        document.getElementById('r-day').innerText = f(now.diff(bd, 'days').days);
        document.getElementById('r-week').innerText = f(now.diff(bd, 'weeks').weeks);
        document.getElementById('r-month').innerText = f(now.diff(bd, 'months').months);
        document.getElementById('r-year').innerText = f(now.diff(bd, 'years').years);
        const dd = now.diff(bd, ['years', 'months', 'weeks', 'days', 'hours', 'minutes', 'seconds']);
        const p = (val, unit) => { const num = Math.trunc(val) + 0; return new Intl.NumberFormat(navigator.language, { style: 'unit', unit: unit, unitDisplay: 'long', numberingSystem: 'latn' }).format(num); };
        const datePart = `${p(dd.years, 'year')}, ${p(dd.months, 'month')}, ${p(dd.weeks, 'week')}, ${p(dd.days, 'day')}`;
        const timePart = `${p(dd.hours, 'hour')}, ${p(dd.minutes, 'minute')}, ${p(dd.seconds, 'second')}`;
        const detailSafeLimit = 28; 
        let dateScale = datePart.length > detailSafeLimit ? Math.max(detailSafeLimit / datePart.length, 0.60) : 1;
        let timeScale = timePart.length > detailSafeLimit ? Math.max(detailSafeLimit / timePart.length, 0.60) : 1;
        let detailUniformScale = Math.min(dateScale, timeScale);
        const userBrowserLocale = navigator.language || 'en-US';
        const timeFormat = u24 ? "HH:mm:ss" : "hh:mm:ss a";
        const curDateStr = now.setLocale("en-US").toFormat("EEE").toUpperCase() + ", " + now.toFormat("yyyy-MM-dd");
        const curTimeStr = now.setLocale("en-US").toFormat(timeFormat);
        const monoSafeLimit = 28; 
        let curDateScale = curDateStr.length > monoSafeLimit ? Math.max(monoSafeLimit / curDateStr.length, 0.60) : 1;
        let curTimeScale = curTimeStr.length > monoSafeLimit ? Math.max(monoSafeLimit / curTimeStr.length, 0.60) : 1;
        let curUniformScale = Math.min(curDateScale, curTimeScale);
        let curComma = ",";
        let detailComma = ", ";
        if (window.innerWidth > 1366) {
            detailUniformScale = 1;
            curUniformScale = 1;
        }
        document.getElementById('r-detailed').innerHTML = `<span class="detail-date" style="font-size: ${detailUniformScale}em;">${datePart}${detailComma}</span><span class="detail-time" style="font-size: ${detailUniformScale}em;">${timePart}</span>`;
        document.getElementById('r-current-time').innerHTML = `<span class="detail-date" style="font-size: ${curUniformScale}em;">${curDateStr}${curComma}</span> <span class="detail-time" style="font-size: ${curUniformScale}em;">${curTimeStr}</span>`;
        document.getElementById('r-time-offset').innerHTML = `<span style="font-size: ${curUniformScale}em;">(UTC ${now.toFormat("ZZ")})</span>`;
    }
    document.getElementById('btn-now').addEventListener('click', () => {
        const now = DateTime.local().plus({ milliseconds: timeOffset }).setZone(document.getElementById('tzLocation').value).startOf('second');
        const bdInput = document.getElementById('birthdatetime');
        if (bdInput._flatpickr) {
            bdInput._flatpickr.setDate(now.toJSDate(), true);
        } else {
            bdInput.value = now.toFormat("yyyy-MM-dd'T'HH:mm:ss");
        }
        calculate(); refreshAllMilestones();
    });
    document.getElementById('btn-clear').addEventListener('click', () => {
        const bdInput = document.getElementById('birthdatetime');
        if (bdInput._flatpickr) {
            bdInput._flatpickr.clear();
        } else {
            bdInput.value = '';
        }
        syncMilestones(null, null);
        calculate();
    });
    document.getElementById('birthdatetime').addEventListener('input', () => { calculate(); refreshAllMilestones(); });
    document.getElementById('tzLocation').addEventListener('change', () => { calculate(); refreshAllMilestones(); });
    document.getElementById('targetTzLocation').addEventListener('change', () => { calculate(); refreshAllMilestones(); });
    document.getElementById('toggleCommas').addEventListener('change', () => { calculate(); refreshAllMilestones(); });
function updateTimeFormat() {
        const is24hr = document.getElementById('toggle24hr').checked;
        const newAltFormat = is24hr ? "Y-m-d, H:i:S" : "Y-m-d, h:i:S K";
        const placeholderStr = is24hr ? "yyyy-mm-dd, HH:mm:ss" : "yyyy-mm-dd, hh:mm:ss AM/PM";
        const mainInput = document.getElementById('birthdatetime');
        if (mainInput && mainInput._flatpickr) {
            const currentDate = mainInput._flatpickr.selectedDates[0];
            mainInput._flatpickr.set('time_24hr', is24hr);
            mainInput._flatpickr.set('altFormat', newAltFormat);
            mainInput._flatpickr.altInput.placeholder = placeholderStr; 
            if (currentDate) {
                mainInput._flatpickr.setDate(currentDate, false);
            } else if (mainInput.value) {
                const dt = DateTime.fromISO(mainInput.value);
                if (dt.isValid) {
                    mainInput._flatpickr.setDate(dt.toJSDate(), false);
                }
            }
        }
        document.querySelectorAll('.milestone-container .ms-date-input').forEach(input => {
            if (input._flatpickr) {
                const savedIso = input.value;
                input._flatpickr.set('time_24hr', is24hr);
                input._flatpickr.set('altFormat', newAltFormat);
                input._flatpickr.altInput.placeholder = placeholderStr;
                if (savedIso) {
                    const dt = DateTime.fromISO(savedIso);
                    if (dt.isValid) {
                        input.value = savedIso;
                        input._flatpickr.altInput.value = dt.toFormat(is24hr ? "yyyy-MM-dd, HH:mm:ss" : "yyyy-MM-dd, hh:mm:ss a");
                    }
                }
            }
        });
        calculate();
        refreshAllMilestones(); 
    }
    document.getElementById('toggle24hr').addEventListener('change', updateTimeFormat);
    const currentYearNum = new Date().getFullYear();
    const newYearString = `${currentYearNum}-01-01T00:00:00`;
    const bdInput = document.getElementById('birthdatetime');
    if (bdInput._flatpickr) {
        bdInput._flatpickr.setDate(newYearString, true);
    } else {
        bdInput.value = newYearString;
    }
    calculate();
    refreshAllMilestones();
    startLocalEngine();
    document.getElementById("current-year").innerText = new Date().getFullYear();
        const yearText = document.getElementById("current-year");
            if (yearText) {
            yearText.innerText = new Date().getFullYear();
        }
        </script>
