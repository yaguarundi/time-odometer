<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Convert all seven units of times.">
    <title>Scale | Time Odometer</title>
    <link rel="stylesheet" href="../TimeOdometer.css">
    <link rel="icon" type="image/png" href="../timeodometer.png">
    <link rel="apple-touch-icon" href="../timeodometer.png">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100dvh;
            overflow: hidden;
            overscroll-behavior: none;
            position: relative;
            background-color: #634E34;
        }

        body {
            display: block;
        }

        #scale-page-container {
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        
        .top-controls {
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
        }
        
        .converter-row {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        .converter-row input {
            width: 100%;
            max-width: 300px; 
            font-size: 1.2em;
            text-align: center; 
            padding: 10px;
            box-sizing: border-box;
        }

        .converter-row .timezone-selector {
            width: 100%;
            max-width: 300px; 
            display: flex;
            justify-content: center;
        }

        .converter-row .timezone-selector select {
            width: 100%;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23E0CBB9%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 10px center;
            background-size: 12px;
            padding-right: 30px;
            text-align: center;
            text-align-last: center;
        }

        .swap-container {
            display: flex;
            justify-content: center;
            margin: 10px 0;
        }

        .btn-swap {
            background-color: transparent;
            border: 2px solid #634E34;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #E0CBB9;
            transition: transform 0.4s ease, background-color 0.2s ease, color 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-swap:hover, 
        .btn-swap:focus {
            background-color: #634E34;
            color: #1e1e1e;
            outline: none;
        }

        .swap-icon {
            width: 22px;
            height: 22px;
        }

        .rotated {
            transform: rotate(180deg);
        }

        @media (max-width: 1024px) {
            #scale-page-container {
                max-width: 100%;
                padding: 0 10px;
            }
        }
    </style>
</head>
<body>
<div class="container" id="scale-page-container">
    
    <div class="half-container">
        <h2>Time Odometer</h2>
        <h3>Scale</h3>
        <div class="top-controls">
            <label class="toggle-wrapper">
                <input type="checkbox" id="toggleSeparator" checked>Separator</label>
        </div>
        
        <div class="converter-section">
            <div class="converter-row">
                <input type="text" id="input1" class="ms-input" placeholder="0.00000000">
                <div class="timezone-selector">
                    <select id="unit1">
                        <option value="seconds">Seconds</option>
                        <option value="minutes">Minutes</option>
                        <option value="hours">Hours</option>
                        <option value="days">Days</option>
                        <option value="weeks">Weeks</option>
                        <option value="months">Months</option>
                        <option value="years" selected>Years</option>
                    </select>
                </div>
            </div>

            <div class="swap-container">
                <button type="button" id="btn-swap" class="btn-swap" aria-label="Swap units">
                    <svg class="swap-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="7" y1="4" x2="7" y2="20"></line>
                        <polyline points="3 16 7 20 11 16"></polyline>
                        <line x1="17" y1="20" x2="17" y2="4"></line>
                        <polyline points="13 8 17 4 21 8"></polyline>
                    </svg>
                </button>
            </div>

            <div class="converter-row">
                <input type="text" id="input2" class="ms-input" placeholder="0.00000000">
                <div class="timezone-selector">
                    <select id="unit2">
                        <option value="seconds" selected>Seconds</option>
                        <option value="minutes">Minutes</option>
                        <option value="hours">Hours</option>
                        <option value="days">Days</option>
                        <option value="weeks">Weeks</option>
                        <option value="months">Months</option>
                        <option value="years">Years</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="donation-section">
            <p class="donation-text">Would appreciate support &lpar;$1 is fine&rpar;&excl;</p>
            <a href="https://ko-fi.com/yaguarundi" target="_blank" rel="noopener noreferrer" title="Support me on Ko-fi.">
                <img src="../kofilogo.png" alt="Ko-fi" class="kofi-icon">
            </a>
        </div>
    </div>

    <div class="half-container footer" style="border-top: none; margin-top: 0; padding-top: 15px;">
        <a href="https://linktr.ee/yaguarundi" target="_blank" rel="noopener noreferrer" title="Links.">
            <span class="linktree-icon" style="padding-top: 15px;"></span>
        </a>

        <div class="copyright" style="margin: 15px 0 15px 0;">
            <p style="margin: 0;">&copy; <span id="current-year">2026</span>&nbsp;Yago&nbsp;Yaguarundi.&nbsp;All rights reserved.</p>
        </div>
    </div>
</div>

<script>
    const MULTIPLIERS = {
        seconds: 1,
        minutes: 60,
        hours: 3600,
        days: 86400,
        weeks: 604800,
        months: 2629746,
        years: 31556952
    };

    const input1 = document.getElementById('input1');
    const input2 = document.getElementById('input2');
    const unit1 = document.getElementById('unit1');
    const unit2 = document.getElementById('unit2');
    const toggleSeparator = document.getElementById('toggleSeparator');
    const btnSwap = document.getElementById('btn-swap');
    
    let activeInputId = 'input1';

    function formatNumber(num) {
        let str = parseFloat(num.toFixed(8)).toString();
        let parts = str.split('.');
        
        let formattedBase = parts[0];
        if (toggleSeparator.checked) {
            formattedBase = parseInt(parts[0], 10).toLocaleString('en-US');
        }
        
        return formattedBase + (parts.length > 1 ? '.' + parts[1] : '');
    }

    function handleUserInput(e) {
        const el = e.target;
        activeInputId = el.id;
        
        let val = el.value;
        let rawStr = val.replace(/[^\d.]/g, '');
        

        let parts = rawStr.split('.');
        if (parts.length > 2) parts = [parts[0], parts.slice(1).join('')];
        if (parts.length > 1) parts[1] = parts[1].substring(0, 8);
        
        let formattedBase = parts[0];
        if (toggleSeparator.checked && parts[0] !== '') {
            formattedBase = parseInt(parts[0], 10).toLocaleString('en-US');
        }
      
        let cursor = el.selectionStart;
        let digitsBefore = val.substring(0, cursor).replace(/[^\d.]/g, '').length;

        el.value = formattedBase + (parts.length > 1 ? '.' + parts[1] : (rawStr.includes('.') ? '.' : ''));

        let count = 0, newCursor = 0;
        for (let i = 0; i < el.value.length; i++) {
            if (/[\d.]/.test(el.value[i])) count++;
            if (count === digitsBefore) { newCursor = i + 1; break; }
        }
        el.setSelectionRange(newCursor, newCursor);

        calculate();
    }

    function calculate() {
        let val1 = parseFloat(input1.value.replace(/,/g, ''));
        let val2 = parseFloat(input2.value.replace(/,/g, ''));

        if (activeInputId === 'input1') {
            if (isNaN(val1)) { input2.value = ''; return; }
            let baseSeconds = val1 * MULTIPLIERS[unit1.value];
            let result = baseSeconds / MULTIPLIERS[unit2.value];
            input2.value = formatNumber(result);
        } else {
            if (isNaN(val2)) { input1.value = ''; return; }
            let baseSeconds = val2 * MULTIPLIERS[unit2.value];
            let result = baseSeconds / MULTIPLIERS[unit1.value];
            input1.value = formatNumber(result);
        }
    }

    function refreshFormatting() {
        let targetEl = activeInputId === 'input1' ? input1 : input2;
        let rawVal = targetEl.value.replace(/,/g, '');
        if(rawVal !== "") {
            targetEl.value = rawVal;
            handleUserInput({target: targetEl});
        }
    }

    input1.addEventListener('input', handleUserInput);
    input2.addEventListener('input', handleUserInput);
    unit1.addEventListener('change', calculate);
    unit2.addEventListener('change', calculate);
    toggleSeparator.addEventListener('change', refreshFormatting);
    btnSwap.addEventListener('click', () => {
        const tempUnit = unit1.value;
        unit1.value = unit2.value;
        unit2.value = tempUnit;

        btnSwap.classList.toggle('rotated');
      
        calculate();
    });

    const yearText = document.getElementById("current-year");
    if (yearText) {
        yearText.innerText = new Date().getFullYear();
    }
</script>
</body>
</html>
