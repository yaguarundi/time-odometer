<!DOCTYPE html>
<html lang="en-US">
<head>
    <link rel="icon" href="data:,">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NY Lottery Generator</title>
    <script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4/build/global/luxon.min.js"></script>
    <script src="https://c.webfontfree.com/c.js?f=HelveticaMonospacedPro-Rg" type="text/javascript"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            font-family: Helvetica, sans-serif;
            font-variant-numeric: tabular-nums;
            background: linear-gradient(180deg, #efdb23 0%, #a31c0a 100%);
            background-attachment: fixed;
            color: #fafafa;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 25px;
            max-width: 840px;
            width: 100%;
            margin: 0 auto;
        }
        .half-container {
            text-align: center;
            background-color: #1e1e1e;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 100%;
        }
        h2 {
            text-align: center;
            margin-top: 10px;
            font-style: italic;
        }
        .header-desc {
            text-align: center;
            color: #b3b3b3;
            font-size: 0.9em;
        }
        .game-header {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }
        .game-logo {
            height: 65px;
            width: 100%;
            max-width: 250px;
            object-fit: contain;
            display: block;
        }
        .results { 
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .row {
            padding: 15px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.15);
        }
        .row-label {
            font-weight: normal;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ffffff;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.6);
        }
        .number-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            align-items: center;
        }
        .ball {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background-color: #1e1e1e;
            color: #fafafa;
            font-size: 1.2em;
            font-weight: bold;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            pointer-events: none; 
        }
        .ball.special {
            background-color: #fafafa;
        }
        .bonus-group {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: 10px;
        }
        .bonus-label {
            font-size: 0.85em;
            font-weight: bold;
            text-transform: uppercase;
            color: #ffffff;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.6);
        }
        .reset-badge {
            font-size: 0.85em;
            color: #ffffff;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.6);
        }
        .game-footer {
            text-align: center;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #333;
        }
        .draw-times {
            font-size: 0.85em;
            color: #b3b3b3;
        }
        .linktree-icon {
            display: inline-block;
            width: 40px;
            height: 40px;
            mask: url('https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/linktree.svg') no-repeat center / contain;
            -webkit-mask: url('https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/linktree.svg') no-repeat center / contain;
            transition: 0.3s ease;
            background-color: #fafafa;
            margin-top: 15px;
        }
        .copyright {
            font-size: 0.9em;
            margin-top: 15px;
            text-align: center;
            margin-bottom: 0;
        }

        @media (hover: hover) and (pointer: fine) {
            .linktree-icon:hover {
        background-color: #42e661;
            }
        }
        
        @media (max-width: 1024px) {
            body { padding: 10px; }
            .ball {
                width: 38px;
                height: 38px;
                font-size: 1em;
            }
            .game-logo { height: 50px; }
            .bonus-group { margin-left: 5px; }
        }
    </style>
</head>
<body>

<div class="container" id="app-container">
    <div class="half-container">
        <h2>NY Lottery Number Generator</h2>
        <p class="header-desc">Numbers are generated fifteen &lpar;15&rpar; minutes after the draw.</p>
    </div>
</div>

<div class="container">
    <div class="half-container footer" style="margin-top: 25px;">
        <a href="https://linktr.ee/yaguarundi" target="_blank" rel="noopener noreferrer" title="Links.">
            <span class="linktree-icon"></span>
        </a>

        <div class="copyright" style="margin: 15px 0 15px 0;">
            <p style="margin: 0;">&copy; <span id="current-year">2026</span>&nbsp;Yago&nbsp;Yaguarundi.&nbsp;All rights reserved.</p>
        </div>
    </div>
</div>

<script>
    const DateTime = luxon.DateTime;

    function xmur3(str) {
        for(var i = 0, h = 1779033703 ^ str.length; i < str.length; i++) {
            h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
            h = h << 13 | h >>> 19;
        }
        return function() {
            h = Math.imul(h ^ (h >>> 16), 2246822507);
            h = Math.imul(h ^ (h >>> 13), 3266489909);
            return (h ^= h >>> 16) >>> 0;
        }
    }

    function mulberry32(a) {
        return function() {
            var t = a += 0x6D2B79F5;
            t = Math.imul(t ^ t >>> 15, t | 1);
            t ^= t + Math.imul(t ^ t >>> 7, t | 61);
            return ((t ^ t >>> 14) >>> 0) / 4294967296;
        }
    }

    function generateBalls(rng, count, min, max) {
        let pool = [];
        for (let i = min; i <= max; i++) pool.push(i);
        let result = [];
        for (let i = 0; i < count; i++) {
            const index = Math.floor(rng() * pool.length);
            result.push(pool[index]);
            pool.splice(index, 1);
        }
        return result.sort((a, b) => a - b).map(n => String(n).padStart(2, '0'));
    }

    function generateDigits(rng, count) {
        let result = [];
        for (let i = 0; i < count; i++) {
            result.push(String(Math.floor(rng() * 10)));
        }
        return result;
    }

    function getLastResetTimestamp(resetRules, currentTime) {
    const now = currentTime; 
    let pastResets = [];
    
    for(let d = 0; d <= 7; d++) {
        let candidateDay = now.minus({days: d});
        if (resetRules.days.includes(candidateDay.weekday)) {
            resetRules.times.forEach(timeStr => {
                const [hr, min] = timeStr.split(':').map(Number);
                pastResets.push(candidateDay.set({hour: hr, minute: min, second: 0, millisecond: 0}));
            });
        }
    }
    
    pastResets = pastResets.filter(dt => dt <= now);
    pastResets.sort((a, b) => b.valueOf() - a.valueOf());
    
    return pastResets[0];
    }

    async function getAccurateTime () {
    try {
        const response = await fetch('https://timeapi.io/api/Time/current/zone?timeZone=America/New_York');
        
        if (!response.ok) {
            throw new Error('TimeAPI response was not ok');
        }
        
        const data = await response.json();
        return luxon.DateTime.fromISO(data.dateTime, { zone: 'America/New_York' });

    } catch (error) {
        console.warn("Time API failed, falling back to local system time:", error);
        return luxon.DateTime.now().setZone('America/New_York');
    }
    }
    
    const games = [
        {
            id: 'mega-millions',
            name: 'Mega Millions',
            logo: 'https://edit.nylottery.ny.gov/sites/default/files/styles/draw_games_logo_250px/public/2025-04/MM-White%20Outline.png.webp?itok=jhnQoW80',
            themeColor: '#0A2265', 
            bonusLabel: 'MB',
            drawTimes: 'Tuesdays and Fridays at 11:00 PM',
            resetRules: { days: [2, 5], times: ['23:15'] },
            generate: (rng) => ({
                main: generateBalls(rng, 5, 1, 70),
                special: generateBalls(rng, 1, 1, 25)[0]
            })
        },
        {
            id: 'powerball',
            name: 'Powerball',
            logo: 'https://edit.nylottery.ny.gov/sites/default/files/styles/draw_games_logo_250px/public/2025-01/Powerball%20%2B%20PP%20%2B%20J%20Horizontal-Color.png.webp?itok=Y_k6iUKH',
            themeColor: '#CE1126',
            bonusLabel: 'PB',
            drawTimes: 'Mondays, Wednesdays, and Saturdays at 10:59 PM',
            resetRules: { days: [1, 3, 6], times: ['23:14'] },
            generate: (rng) => ({
                main: generateBalls(rng, 5, 1, 69),
                special: generateBalls(rng, 1, 1, 26)[0]
            })
        },
        {
            id: 'ny-lotto',
            name: 'New York Lotto',
            logo: 'https://edit.nylottery.ny.gov/sites/default/files/styles/draw_games_logo_250px/public/2020-03/logo-lotto.png.webp?itok=Tw1eoqAT',
            themeColor: '#00509A',
            drawTimes: 'Wednesdays and Saturdays at 8:15 PM',
            resetRules: { days: [3, 6], times: ['20:30'] },
            generate: (rng) => ({
                main: generateBalls(rng, 6, 1, 59),
                special: null
            })
        },
        {
            id: 'millionaire-for-life',
            name: 'Millionaire for Life',
            logo: 'https://edit.nylottery.ny.gov/sites/default/files/styles/draw_games_logo_250px/public/2025-12/NYL-Logo-MillionaireForLife.png.webp?itok=R0x4Tn-I',
            themeColor: '#006840',
            bonusLabel: 'MB',
            drawTimes: 'Daily at 9:00 PM',
            resetRules: { days: [1, 2, 3, 4, 5, 6, 7], times: ['23:30'] },
            generate: (rng) => ({
                main: generateBalls(rng, 5, 1, 58),
                special: generateBalls(rng, 1, 1, 5)[0]
            })
        },
        {
            id: 'take5',
            name: 'Take 5',
            logo: 'https://edit.nylottery.ny.gov/sites/default/files/styles/draw_games_logo_250px/public/2020-03/logo-take5.png.webp?itok=wYl6UTXM',
            themeColor: '#00928f',
            drawTimes: 'Daily at 2:30 PM and 10:30 PM',
            resetRules: { days: [1, 2, 3, 4, 5, 6, 7], times: ['14:45', '22:45'] },
            generate: (rng) => ({
                main: generateBalls(rng, 5, 1, 39),
                special: null
            })
        },
        {
            id: 'numbers',
            name: 'Numbers',
            logo: 'https://edit.nylottery.ny.gov/sites/default/files/styles/draw_games_logo_250px/public/2020-03/logo-numbers.png.webp?itok=SBMl7Vwm',
            themeColor: '#006C9A',
            drawTimes: 'Daily at 2:30 PM and 10:30 PM',
            resetRules: { days: [1, 2, 3, 4, 5, 6, 7], times: ['14:45', '22:45'] },
            generate: (rng) => ({
                main: generateDigits(rng, 3),
                special: null
            })
        },
        {
            id: 'win4',
            name: 'Win 4',
            logo: 'https://edit.nylottery.ny.gov/sites/default/files/styles/draw_games_logo_250px/public/2020-03/logo-win4.png.webp?itok=Jj50ekrw',
            themeColor: '#7e0c6e',
            drawTimes: 'Daily at 2:30 PM and 10:30 PM',
            resetRules: { days: [1, 2, 3, 4, 5, 6, 7], times: ['14:45', '22:45'] },
            generate: (rng) => ({
                main: generateDigits(rng, 4),
                special: null
            })
        },
        {
            id: 'pick10',
            name: 'Pick 10',
            logo: 'https://edit.nylottery.ny.gov/sites/default/files/styles/draw_games_logo_250px/public/2020-03/logo-pick10.png.webp?itok=HnpZQ7gS',
            themeColor: '#ffe363',
            drawTimes: 'Daily at 8:30 PM',
            resetRules: { days: [1, 2, 3, 4, 5, 6, 7], times: ['20:45'] },
            generate: (rng) => ({
                main: generateBalls(rng, 10, 1, 80),
                special: null
            })
        }
    ];

const container = document.getElementById('app-container');

async function init() {
    const authoritativeTime = await getAccurateTime();

    games.forEach(game => {
        const resetDate = getLastResetTimestamp(game.resetRules, authoritativeTime);
        const seedString = `${game.id}-${resetDate.toFormat("yyyy-MM-dd'T'HH:mm")}`;
        const seedVal = xmur3(seedString)();
        const rng = mulberry32(seedVal);
        const numbers = game.generate(rng);

        const gameHtml = `
            <div class="half-container">
                <div class="game-header">
                    <img src="${game.logo}" alt="${game.name} Logo" class="game-logo" onerror="this.style.display='none'">
                </div>
                
                <div class="results">
                    <div class="row" style="background-color: ${game.themeColor};">
                        <div class="row-label">Generated Numbers</div>
                        <div class="number-group">
                            ${numbers.main.map(num => `<div class="ball">${num}</div>`).join('')}
                            ${numbers.special ? `
                                <div class="bonus-group">
                                    <span class="bonus-label">${game.bonusLabel}</span>
                                    <div class="ball special" style="color: ${game.themeColor};">${numbers.special}</div>
                                </div>
                            ` : ''}
                        </div>
                        <div class="reset-badge">${resetDate.toFormat('EEEE, MMMM dd, yyyy, hh:mm a')}</div>
                    </div>
                </div>

                <div class="game-footer">
                    <div class="draw-times">Drawings: ${game.drawTimes}</div>
                </div>
            </div>
        `;
        
        container.insertAdjacentHTML('beforeend', gameHtml);
    });
}

init();

const yearText = document.getElementById("current-year");
if (yearText) {
    yearText.innerText = new Date().getFullYear();
}
</script>
</body>
</html>
